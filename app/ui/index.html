<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>LocalPress</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="wordmark" href="#/" aria-label="LocalPress library">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M8 12h8M12 8.5v7" class="mark-cross"/></svg>
      <span>LocalPress</span>
    </a>
    <div class="topbar-right">
      <div class="disk" id="disk" aria-live="polite"></div>
      <button class="btn ghost" id="queue-btn" type="button" aria-controls="queue-drawer" aria-expanded="false"></button>
      <button class="btn ghost" id="tools-btn" type="button" aria-controls="tools-drawer" aria-expanded="false"></button>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <aside class="drawer" id="queue-drawer" aria-label="Queue" hidden></aside>
  <aside class="drawer" id="tools-drawer" aria-label="Tools" hidden></aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="compare" id="compare" role="dialog" aria-modal="true" aria-label="Compare original and output" hidden></div>

  <div class="dropveil" id="dropveil" hidden>
    <div class="dropveil-inner">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 14.5V18a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3.5"/></svg>
      <p>Drop to copy into your library</p>
      <small>Originals stay where they are</small>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <input type="file" id="file-input" accept="video/*,.mkv,.ts,.mts,.m2ts,.flv,.wmv" multiple hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
